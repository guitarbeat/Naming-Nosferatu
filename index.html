<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.json" />
  <title>Name Nosferatu</title>

  <!-- Mobile-specific meta tags for better navbar experience -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- SEO -->
  <meta name="description"
    content="Cat name tournament voting, Elo rankings, and interactive management dashboard" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#FDFBF7" />

  <!-- Open Graph -->
  <meta property="og:title" content="Name Nosferatu" />
  <meta property="og:description" content="Cat name tournament voting, Elo rankings, and interactive management dashboard" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/images/cats/cat_01.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Name Nosferatu" />
  <meta name="twitter:description" content="Tournament-style voting for cat names." />
  <meta name="twitter:image" content="/assets/images/cats/cat_01.webp" />

  <!-- Font performance - optimized loading strategy -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  <link rel="dns-prefetch" href="//ocghxwwwuubgmwsxgyoy.supabase.co" />
  <link rel="preconnect" href="https://ocghxwwwuubgmwsxgyoy.supabase.co" crossorigin />
  <!-- * Load fonts asynchronously to prevent render blocking -->
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    as="style" onload="
        this.onload = null;
        this.rel = 'stylesheet';
      " />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <!-- Custom cat favicon -->
  <link rel="icon" href="/assets/images/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/images/favicon.png" />

  <!-- Capture Chromium install prompt before the app bundle loads -->
  <script>
    window.__deferredPwaPrompt = null;
    window.addEventListener(
      "beforeinstallprompt",
      function (event) {
        event.preventDefault();
        event.stopPropagation();
        window.__deferredPwaPrompt = event;
      },
      { capture: true },
    );
  </script>

  <!-- * Optimize painting performance with no-visible-paint directive -->
  <style>
    html {
      background-color: #FDFBF7;
    }

    body {
      background-color: #FDFBF7;
    }
  </style>
</head>

<body>
  <script>
    (function applyInitialTheme() {
      try {
        const { documentElement, body } = document;
        if (!documentElement) {
          return;
        }

        let storedTheme = "light";
        try {
          storedTheme = localStorage.getItem("theme") || "light";
        } catch (_) {}

        const resolvedTheme = "light";

        documentElement.dataset.theme = resolvedTheme;
        if (body) {
          body.dataset.theme = resolvedTheme;
        }
      } catch (err) {
        console.warn("Theme init error:", err);
      }
    })();
  </script>
  <div id="root"></div>
  <!-- * Entry point - Vite transforms this path during build to point to bundled assets -->
  <script type="module" src="/src/app/index.tsx"></script>
</body>

</html>
