<!doctype html>
<html lang="en" class="dark" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.json" />
  <title>Name Nosferatu</title>

  <!-- Mobile-specific meta tags for better navbar experience -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- SEO -->
  <meta name="description"
    content="Cat name tournament voting and Elo rankings" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0f0c18" />

  <!-- Open Graph -->
  <meta property="og:title" content="Name Nosferatu" />
  <meta property="og:description" content="Cat name tournament voting and Elo rankings" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/images/cats/cat_01.webp" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Name Nosferatu" />
  <meta name="twitter:description" content="Tournament-style voting for cat names." />
  <meta name="twitter:image" content="/assets/images/cats/cat_01.webp" />

  <!-- Font performance - optimized loading strategy -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    as="style" onload="
        this.onload = null;
        this.rel = 'stylesheet';
      " />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </noscript>
  <link rel="icon" href="/assets/images/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/images/favicon.png" />

  <script>
    window.__deferredPwaPrompt = null;
    window.addEventListener(
      "beforeinstallprompt",
      function (event) {
        event.preventDefault();
        event.stopPropagation();
        window.__deferredPwaPrompt = event;
      },
      { capture: true },
    );
  </script>

  <style>
    html, body {
      background-color: #0f0c18;
      color: #ede9f6;
    }
  </style>
</head>

<body>
  <script>
    (function applyInitialTheme() {
      try {
        var root = document.documentElement;
        var stored = localStorage.getItem("nn_theme_v2") || "dark";
        var resolved = stored === "light" ? "light" : "dark";
        root.dataset.theme = resolved;
        root.classList.toggle("dark", resolved === "dark");
      } catch (err) {
        console.warn("Theme init error:", err);
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
